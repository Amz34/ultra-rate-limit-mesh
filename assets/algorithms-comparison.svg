<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .card { fill: #161b22; stroke: #30363d; stroke-width: 1.5; rx: 8px; }
      .header { fill: #f0f6fc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: 600; }
      .text { fill: #c9d1d9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; }
      .muted { fill: #8b949e; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; }
      .code { fill: #79c0ff; font-family: "SFMono-Regular", Consolas, monospace; font-size: 11px; }
      .tag { rx: 4px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; }
      .tag-green { fill: #238636; }
      .tag-red { fill: #da3633; }
      .tag-blue { fill: #1f6feb; }
      .tag-purple { fill: #8957e5; }
      .tag-text { fill: #ffffff; text-anchor: middle; }
    </style>
  </defs>

  <rect width="1000" height="620" class="bg" rx="12" />

  <text x="40" y="45" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700">Top 5 Rate Limiting Algorithms: In-Depth Architectural Comparison</text>
  <text x="40" y="68" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Mathematical foundation, memory complexity, burst characteristics, and optimal production use cases</text>

  <!-- 1. Token Bucket -->
  <g transform="translate(40, 95)">
    <rect width="920" height="90" class="card" />
    <rect x="20" y="15" width="24" height="20" rx="4" fill="#30363d" />
    <text x="32" y="29" fill="#58a6ff" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">1</text>
    <text x="55" y="30" class="header">Token Bucket</text>
    <rect x="180" y="16" width="75" height="18" class="tag tag-green" />
    <text x="217" y="29" class="tag tag-text">BURST-FRIENDLY</text>
    <rect x="265" y="16" width="60" height="18" class="tag tag-blue" />
    <text x="295" y="29" class="tag tag-text">O(1) MEM</text>
    
    <text x="55" y="55" class="text">Refills tokens into a bucket of capacity C at rate r tokens/sec. Request allowed if tokens ≥ 1, then decremented.</text>
    <text x="55" y="75" class="muted">Pros: Supports traffic bursts up to capacity C. Cons: Tuning refill rate and capacity requires careful sizing.</text>
    <text x="650" y="30" class="code">T' = min(C, T + (Δt · r))</text>
    <text x="650" y="55" class="muted">Ideal: User-facing REST/GraphQL APIs, Search boxes</text>
  </g>

  <!-- 2. Fixed Window Counter -->
  <g transform="translate(40, 195)">
    <rect width="920" height="90" class="card" />
    <rect x="20" y="15" width="24" height="20" rx="4" fill="#30363d" />
    <text x="32" y="29" fill="#58a6ff" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">2</text>
    <text x="55" y="30" class="header">Fixed Window Counter</text>
    <rect x="220" y="16" width="85" height="18" class="tag tag-red" />
    <text x="262" y="29" class="tag tag-text">2x BOUNDARY SPIKE</text>
    <rect x="315" y="16" width="60" height="18" class="tag tag-blue" />
    <text x="345" y="29" class="tag tag-text">O(1) MEM</text>

    <text x="55" y="55" class="text">Partitions time into fixed intervals (e.g. 60s). Counts requests per interval and resets at boundary.</text>
    <text x="55" y="75" class="muted">Pros: Minimal memory &amp; trivial logic. Cons: Vulnerable to 200% burst spikes across window boundaries.</text>
    <text x="650" y="30" class="code">Window = floor(now / W)</text>
    <text x="650" y="55" class="muted">Ideal: Simple internal cron rate limiting, non-critical batches</text>
  </g>

  <!-- 3. Leaky Bucket -->
  <g transform="translate(40, 295)">
    <rect width="920" height="90" class="card" />
    <rect x="20" y="15" width="24" height="20" rx="4" fill="#30363d" />
    <text x="32" y="29" fill="#58a6ff" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">3</text>
    <text x="55" y="30" class="header">Leaky Bucket</text>
    <rect x="170" y="16" width="80" height="18" class="tag tag-purple" />
    <text x="210" y="29" class="tag tag-text">TRAFFIC SHAPER</text>
    <rect x="260" y="16" width="60" height="18" class="tag tag-blue" />
    <text x="290" y="29" class="tag tag-text">O(1) MEM</text>

    <text x="55" y="55" class="text">Requests enter a queue of size B and drain at an invariant leak rate L. Rejects when queue overflows.</text>
    <text x="55" y="75" class="muted">Pros: Smooths bursty traffic into steady stream. Cons: Bursts are queued/delayed rather than dispatched fast.</text>
    <text x="650" y="30" class="code">Q' = max(0, Q - (Δt · L))</text>
    <text x="650" y="55" class="muted">Ideal: Database write buffering, background message queues</text>
  </g>

  <!-- 4. Sliding Window Log -->
  <g transform="translate(40, 395)">
    <rect width="920" height="90" class="card" />
    <rect x="20" y="15" width="24" height="20" rx="4" fill="#30363d" />
    <text x="32" y="29" fill="#58a6ff" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">4</text>
    <text x="55" y="30" class="header">Sliding Window Log</text>
    <rect x="210" y="16" width="70" height="18" class="tag tag-green" />
    <text x="245" y="29" class="tag tag-text">100% EXACT</text>
    <rect x="290" y="16" width="75" height="18" class="tag tag-red" />
    <text x="327" y="29" class="tag tag-text">O(N) MEMORY</text>

    <text x="55" y="55" class="text">Retains timestamps of all requests in rolling sorted set. Discards records older than (now - W).</text>
    <text x="55" y="75" class="muted">Pros: 100% boundary accuracy, 0% leakage. Cons: Huge memory overhead under high concurrency.</text>
    <text x="650" y="30" class="code">prune(t &lt; now - W); len &lt; limit</text>
    <text x="650" y="55" class="muted">Ideal: Low-volume high-security auth gates, credit-card checkout</text>
  </g>

  <!-- 5. Sliding Window Counter -->
  <g transform="translate(40, 495)">
    <rect width="920" height="90" class="card" stroke="#58a6ff" stroke-width="2" />
    <rect x="20" y="15" width="24" height="20" rx="4" fill="#1f6feb" />
    <text x="32" y="29" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">5</text>
    <text x="55" y="30" class="header" fill="#58a6ff">Sliding Window Counter (Cloudflare / Stripe Standard)</text>
    <rect x="420" y="16" width="85" height="18" class="tag tag-green" />
    <text x="462" y="29" class="tag tag-text">99.8% ACCURATE</text>
    <rect x="515" y="16" width="60" height="18" class="tag tag-blue" />
    <text x="545" y="29" class="tag tag-text">O(1) MEM</text>

    <text x="55" y="55" class="text">Weights previous window count by time remaining, adding current window count. Eliminates boundary spikes.</text>
    <text x="55" y="75" class="muted">Pros: Best-in-class trade-off: O(1) memory, zero boundary burst leaks, sub-millisecond execution.</text>
    <text x="650" y="30" class="code" fill="#58a6ff">Count = curr + prev · (1 - t/W)</text>
    <text x="650" y="55" class="muted">Ideal: Enterprise API Gateways, Edge Workers, SaaS Platforms</text>
  </g>
</svg>
