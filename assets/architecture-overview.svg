<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #30363d; stroke-width: 1.5; rx: 8px; }
      .box-highlight { fill: #161b22; stroke: #58a6ff; stroke-width: 2; rx: 8px; }
      .title { fill: #58a6ff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; font-weight: 600; }
      .label { fill: #c9d1d9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 500; }
      .subtext { fill: #8b949e; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; }
      .code { fill: #79c0ff; font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 11px; }
      .arrow { stroke: #58a6ff; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .arrow-dashed { stroke: #d29922; stroke-width: 1.5; stroke-dasharray: 4,4; fill: none; marker-end: url(#arrowhead-amber); }
      .badge-pass { fill: #238636; }
      .badge-warn { fill: #9e6a03; }
      .badge-text { fill: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#58a6ff" />
    </marker>
    <marker id="arrowhead-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#d29922" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="480" class="bg" rx="12" />

  <!-- Main Title -->
  <text x="40" y="45" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700">Multi-Tier Distributed Rate Limiting &amp; Resilience Topology</text>
  <text x="40" y="68" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">End-to-end client pre-flight shielding, edge isolate filtering, and atomic cluster coordination</text>

  <!-- Tier 1: Client Layer -->
  <g transform="translate(40, 100)">
    <rect width="210" height="330" class="box" />
    <rect x="15" y="15" width="60" height="18" rx="4" class="badge-pass" />
    <text x="45" y="27" text-anchor="middle" class="badge-text">TIER 1</text>
    <text x="15" y="55" class="title">Frontend Client SDK</text>
    <text x="15" y="75" class="subtext">Client-Side Pre-Flight Armor</text>

    <!-- Sub-blocks inside Client -->
    <rect x="15" y="95" width="180" height="65" rx="6" fill="#21262d" stroke="#30363d" />
    <text x="25" y="115" class="label">Pre-Flight Token Bucket</text>
    <text x="25" y="132" class="subtext">• Local quota accounting</text>
    <text x="25" y="147" class="subtext">• Prevents mobile radio flood</text>

    <rect x="15" y="170" width="180" height="65" rx="6" fill="#21262d" stroke="#30363d" />
    <text x="25" y="190" class="label">Full Jitter Backoff</text>
    <text x="25" y="207" class="code">sleep = rand(0, min(cap, b·2^i))</text>
    <text x="25" y="222" class="subtext">• Eliminates Thundering Herd</text>

    <rect x="15" y="245" width="180" height="65" rx="6" fill="#21262d" stroke="#30363d" />
    <text x="25" y="265" class="label">Circuit Breaker</text>
    <text x="25" y="282" class="subtext">• CLOSED → OPEN → HALF_OPEN</text>
    <text x="25" y="297" class="subtext">• Reactive UI state events</text>
  </g>

  <!-- Arrow Tier 1 to 2 -->
  <path d="M 250 250 L 285 250" class="arrow" />
  <text x="267" y="240" text-anchor="middle" class="code" font-size="10">HTTPS</text>

  <!-- Tier 2: Edge Layer -->
  <g transform="translate(290, 100)">
    <rect width="200" height="330" class="box-highlight" />
    <rect x="15" y="15" width="60" height="18" rx="4" fill="#1f6feb" />
    <text x="45" y="27" text-anchor="middle" class="badge-text">TIER 2</text>
    <text x="15" y="55" class="title">Cloudflare Edge Worker</text>
    <text x="15" y="75" class="subtext">Global CDN V8 Isolates</text>

    <rect x="15" y="95" width="170" height="90" rx="6" fill="#21262d" stroke="#30363d" />
    <text x="25" y="115" class="label">Sliding Window Counter</text>
    <text x="25" y="132" class="code">Count = curr + prev·(1-t/W)</text>
    <text x="25" y="150" class="subtext">• Sub-8ms edge inspection</text>
    <text x="25" y="165" class="subtext">• Blocks DDoS before origin</text>

    <rect x="15" y="195" width="170" height="115" rx="6" fill="#21262d" stroke="#30363d" />
    <text x="25" y="215" class="label">RFC 6585 Headers</text>
    <text x="25" y="235" class="code">Retry-After: 3</text>
    <text x="25" y="252" class="code">X-RateLimit-Limit: 100</text>
    <text x="25" y="269" class="code">X-RateLimit-Remaining: 0</text>
    <text x="25" y="286" class="code">X-RateLimit-Reset: 179558</text>
  </g>

  <!-- Arrow Tier 2 to 3 -->
  <path d="M 490 250 L 525 250" class="arrow" />
  <text x="507" y="240" text-anchor="middle" class="code" font-size="10">TCP/mTLS</text>

  <!-- Tier 3: Ingress Gateway -->
  <g transform="translate(530, 100)">
    <rect width="200" height="330" class="box" />
    <rect x="15" y="15" width="60" height="18" rx="4" class="badge-pass" />
    <text x="45" y="27" text-anchor="middle" class="badge-text">TIER 3</text>
    <text x="15" y="55" class="title">Origin API Gateway</text>
    <text x="15" y="75" class="subtext">High-Throughput Node 22</text>

    <rect x="15" y="95" width="170" height="75" rx="6" fill="#21262d" stroke="#30363d" />
    <text x="25" y="115" class="label">5-Algorithm Selector</text>
    <text x="25" y="132" class="subtext">• Token / Leaky Bucket</text>
    <text x="25" y="147" class="subtext">• Fixed / Sliding Window</text>

    <rect x="15" y="180" width="170" height="130" rx="6" fill="#21262d" stroke="#30363d" />
    <text x="25" y="200" class="label">Microsecond Engine</text>
    <text x="25" y="218" class="code">1.19M - 3.68M ops/sec</text>
    <text x="25" y="235" class="subtext">• Native TS (strip-types)</text>
    <text x="25" y="250" class="subtext">• Live /api/metrics telemetry</text>
    <text x="25" y="265" class="subtext">• Docker healthcheck gate</text>
    <text x="25" y="280" class="subtext">• Zero external dependencies</text>
  </g>

  <!-- Arrow Tier 3 to 4 -->
  <path d="M 730 250 L 765 250" class="arrow" />
  <text x="747" y="240" text-anchor="middle" class="code" font-size="10">RESP</text>

  <!-- Tier 4: Distributed State -->
  <g transform="translate(770, 100)">
    <rect width="190" height="330" class="box" />
    <rect x="15" y="15" width="60" height="18" rx="4" class="badge-warn" />
    <text x="45" y="27" text-anchor="middle" class="badge-text">TIER 4</text>
    <text x="15" y="55" class="title">Distributed Redis</text>
    <text x="15" y="75" class="subtext">Atomic Cluster State</text>

    <rect x="15" y="95" width="160" height="100" rx="6" fill="#21262d" stroke="#30363d" />
    <text x="25" y="115" class="label">Atomic Lua Scripts</text>
    <text x="25" y="132" class="subtext">• Zero race conditions</text>
    <text x="25" y="147" class="subtext">• EVALSHA compiled</text>
    <text x="25" y="162" class="subtext">• PEXPIRE auto-eviction</text>
    <text x="25" y="177" class="code">HMGET / INCRBY</text>

    <rect x="15" y="205" width="160" height="105" rx="6" fill="#21262d" stroke="#30363d" />
    <text x="25" y="225" class="label">Downstream Targets</text>
    <text x="25" y="245" class="subtext">• Microservices</text>
    <text x="25" y="260" class="subtext">• LLM Inference APIs</text>
    <text x="25" y="275" class="subtext">• SQL / NoSQL Databases</text>
    <text x="25" y="290" class="subtext">• Payment Gateways</text>
  </g>
</svg>
